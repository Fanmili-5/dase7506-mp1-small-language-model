name: Frozen-model CPU runtime check

on:
  push:
    branches: [codex/runtime-portability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify frozen assets and runtime equivalence
        run: |
          python scripts/verify_fixed_files.py
          python scripts/verify_submission.py
          python -m unittest discover -s tests -v
          python scripts/export_static_runtime.py --output runs/static-runtime/checkpoint.pt
          python scripts/check_static_runtime.py --checkpoint runs/static-runtime/checkpoint.pt --threads 1 --output results/runtime-audit/equivalence-linux.json
      - name: Three alternating full-validation CPU resource comparisons
        run: |
          python scripts/benchmark_cpu.py --baseline benchmark_controls/baseline-stage3-long-s17.pt --candidate runs/static-runtime/checkpoint.pt --threads 1 --repeats 3 --output results/runtime-audit/resources-linux.json
          python -c "import json; r=json.load(open('results/runtime-audit/resources-linux.json')); assert all(abs(x-1.399686162042141)<2e-5 for x in r['candidate']['bpb_runs']); assert r['within_five_x_time_limit']; assert r['within_four_gib_peak_rss_limit']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-portability
          path: code/results/runtime-audit/
          if-no-files-found: error
