name: Frozen final predictor reproduction

on:
  push:
    branches: [codex/runtime-portability]
    paths: ['.github/workflows/runtime-portability.yml', 'code/scripts/final_submission.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify frozen assets and runtime equivalence
        run: |
          python scripts/verify_fixed_files.py
          python scripts/verify_submission.py
          python -m unittest discover -s tests -v
          python scripts/export_static_runtime.py --output runs/static-runtime/checkpoint.pt
          python scripts/check_static_runtime.py --checkpoint runs/static-runtime/checkpoint.pt --threads 1 --output results/runtime-audit/equivalence-linux.json
      - name: Freeze the measured execution and reproduce the complete test
        run: |
          python scripts/final_submission.py freeze-and-score --output runs/static-final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-final-predictor
          path: |
            code/runs/static-final/
            code/results/runtime-audit/
          if-no-files-found: error
