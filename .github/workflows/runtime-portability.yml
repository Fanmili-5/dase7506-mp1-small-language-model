name: Frozen-model CPU runtime check

on:
  push:
    branches: [codex/runtime-portability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify unchanged submission and profile static shapes
        run: |
          python scripts/verify_fixed_files.py
          python scripts/verify_submission.py
          python scripts/profile_static_features.py --code . --threads 1 --output results/runtime-audit/static-features-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-portability
          path: code/results/runtime-audit/
          if-no-files-found: error
