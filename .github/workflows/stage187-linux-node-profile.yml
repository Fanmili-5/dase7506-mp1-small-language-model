name: Stage187 Linux OpenVINO node profile

on:
  push:
    branches:
      - experiments/v2-long-schedule
    paths:
      - .github/workflows/stage187-linux-node-profile.yml
      - code/scripts/profile_stage187_openvino_nodes.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        working-directory: code
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify benchmark files and profile validation inputs only
        working-directory: code
        run: |
          python scripts/verify_fixed_files.py
          python scripts/profile_stage187_openvino_nodes.py \
            --batches 8 \
            --output results/stage187-linux-node-profile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage187-linux-node-profile
          path: code/results/stage187-linux-node-profile.json
          if-no-files-found: ignore
