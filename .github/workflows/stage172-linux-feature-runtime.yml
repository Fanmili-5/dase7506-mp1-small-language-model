name: Stage172 Linux feature runtime preflight

on:
  push:
    branches:
      - experiments/v2-long-schedule
    paths:
      - .github/workflows/stage172-linux-feature-runtime.yml
      - code/scripts/benchmark_stage172_feature_runtime.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        working-directory: code
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt onnxruntime==1.26.0
      - name: Compare frozen FP32 feature graph on validation inputs only
        working-directory: code
        run: |
          python scripts/verify_fixed_files.py
          python scripts/benchmark_stage172_feature_runtime.py \
            --checkpoint checkpoints/stage143-openvino-order6.pt \
            --batches 8 \
            --output results/stage172-linux-feature-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage172-linux-feature-runtime
          path: code/results/stage172-linux-feature-runtime.json
          if-no-files-found: ignore
