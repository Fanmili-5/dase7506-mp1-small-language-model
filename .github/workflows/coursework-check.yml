name: Coursework checks

on:
  push:
    branches: [codex/submission]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU environment
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify frozen files and unit tests
        run: |
          python scripts/verify_fixed_files.py
          python scripts/verify_submission.py
          python -m unittest discover -s tests -v
          python scripts/reproduce_training.py --run-dir runs/ci-plan --plan
      - name: Score the complete validation split
        run: |
          python evaluate.py --checkpoint checkpoints/stage143-openvino-order6.pt --device cpu --precision fp32 --threads 4 --split validation --output reproduced-validation.json
          python -c "import json; r=json.load(open('reproduced-validation.json')); assert r['targets']==376599; assert r['utf8_bytes']==1148007; assert abs(r['bpb']-1.399686162042141)<2e-5"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-reproduction
          path: code/reproduced-validation.json
