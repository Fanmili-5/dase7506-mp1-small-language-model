name: Stage143 Linux CPU validation reproduction

on:
  push:
    branches:
      - experiments/v2-long-schedule
    paths:
      - .github/workflows/stage143-linux-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        working-directory: code
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify fixed files and run contract tests
        working-directory: code
        run: |
          python scripts/verify_fixed_files.py
          python -m unittest discover -s tests
      - name: Score full validation only
        working-directory: code
        run: |
          python evaluate.py \
            --checkpoint checkpoints/stage143-openvino-order6.pt \
            --device cpu --precision fp32 --threads 4 --split validation \
            --output results/stage143-linux-x86-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage143-linux-validation
          path: |
            code/results/stage143-linux-x86-validation.json
            code/results/stage143-linux-x86-validation.window-nll.npy
          if-no-files-found: ignore
