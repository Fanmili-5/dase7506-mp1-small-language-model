name: Stage143 Linux CPU validation reproduction

on:
  push:
    branches:
      - experiments/v2-long-schedule
    paths:
      - .github/workflows/stage143-linux-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        working-directory: code
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements_stage143.txt
      - name: Verify fixed files and run contract tests
        working-directory: code
        run: |
          python scripts/verify_fixed_files.py
          python -m unittest discover -s tests
      - name: Inspect OpenVINO CPU properties
        working-directory: code
        run: |
          python - <<'PY'
          import os
          import openvino as ov
          print('visible_cpus:', os.cpu_count(), flush=True)
          core = ov.Core()
          compiled = core.compile_model(
              'inference_assets/stage143-stage92-features.onnx', 'CPU', {
                  'INFERENCE_PRECISION_HINT': ov.Type.f32,
                  'INFERENCE_NUM_THREADS': 4,
                  'NUM_STREAMS': 1,
                  'ENABLE_CPU_PINNING': False,
              })
          for key in ('INFERENCE_PRECISION_HINT', 'INFERENCE_NUM_THREADS',
                      'NUM_STREAMS', 'ENABLE_CPU_PINNING'):
              print(key, repr(compiled.get_property(key)), flush=True)
          PY
      - name: Score full validation only
        working-directory: code
        run: |
          python evaluate.py \
            --checkpoint checkpoints/stage143-openvino-order6.pt \
            --device cpu --precision fp32 --threads 4 --split validation \
            --output results/stage143-linux-x86-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage143-linux-validation
          path: |
            code/results/stage143-linux-x86-validation.json
            code/results/stage143-linux-x86-validation.window-nll.npy
          if-no-files-found: ignore
